# Render service definition for the RAGScope backend.
#
# The file declares the FastAPI service; Render auto-deploys from the main
# branch of the connected GitHub repo. Secrets are not committed to this
# file: every envVar entry uses sync=false so Render reads the actual value
# from the dashboard, not from this repo. To rotate or set a value, open
# the service in the Render dashboard and update the variable there.
#
# Free-tier note: the service spins down after roughly 15 minutes of
# idleness. The first request after a spin-down takes 20 to 30 seconds
# while the worker boots and tables are validated by create_tables().

services:
  - type: web
    name: ragscope-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        sync: false
      - key: LANGCHAIN_PROJECT
        sync: false
      - key: DEV_TOKEN
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        sync: false
